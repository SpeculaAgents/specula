name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Contracts
        working-directory: contracts
        run: |
          forge install --no-git foundry-rs/forge-std@v1.16.2
          forge build
          forge test
      - name: Engine
        working-directory: engine
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Packages
        working-directory: packages
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Site
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test
